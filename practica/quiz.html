<style>
.quiz-container {
  max-width: 720px;
  margin: 40px auto;
  text-align: center;
  padding: 0 5%;
}
.quiz-container h1 {
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  background: linear-gradient(135deg, var(--magenta) 0%, #a855f7 50%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.quiz-container > p { color: var(--gris-suave); margin-bottom: 20px; }

/* Category selector */
.cat-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
}
.cat-btn {
  padding: 8px 16px;
  border-radius: 30px;
  border: 2px solid #e0d6ff;
  background: white;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--negro);
}
.cat-btn:hover, .cat-btn.active {
  background: var(--morado);
  color: white;
  border-color: var(--morado);
}

/* Progress bar */
.progress-wrap {
  background: #f3f4f6;
  border-radius: 10px;
  height: 8px;
  margin-bottom: 20px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--magenta), var(--cyan));
  border-radius: 10px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 0.82rem;
  color: var(--gris-suave);
  font-weight: 600;
  margin-bottom: 8px;
  text-align: right;
}

/* Question */
.question {
  margin-bottom: 24px;
}
.question video {
  width: 100%;
  max-width: 420px;
  height: 240px;
  object-fit: cover;
  border-radius: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.question h2 {
  font-family: 'Outfit', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  color: var(--negro);
}
.q-prompt {
  font-size: 0.9rem;
  color: var(--gris-suave);
  margin-bottom: 8px;
}

/* Options */
.options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  width: 100%;
  margin: auto;
}
.option {
  background: white;
  border: 2px solid #e0d6ff;
  padding: 14px 12px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s;
  color: var(--negro);
}
.option:hover { background: #ede9ff; border-color: var(--morado); }
.option.correct { background: #22c55e; color: white; border-color: #22c55e; }
.option.wrong { background: #ef4444; color: white; border-color: #ef4444; }

.video-option {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 10px;
  pointer-events: none;
}

/* Score display */
.score-display {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--gris-suave);
  margin-top: 16px;
}
.score-display b { color: var(--morado); }

.next-btn {
  margin-top: 18px;
  padding: 12px 32px;
  background: var(--morado);
  color: white;
  border: none;
  border-radius: 30px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
  display: none;
}
.next-btn:hover { opacity: 0.85; }
.next-btn.visible { display: inline-block; }
</style>
</head>

<div style="height:3px;background:linear-gradient(90deg,var(--magenta),#a855f7,var(--cyan))"></div>

<div class="quiz-container">
  <h1>🧠 Quiz</h1>
  <p>Pon a prueba tu conocimiento de señas. Elige una categoría:</p>

  <div class="cat-selector" id="catSelector"></div>

  <div class="progress-label" id="progressLabel">Pregunta 1 de 5</div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <p class="score-display">Puntaje: <b id="score">0</b></p>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Siguiente →</button>
</div>

<script>
const ALL_DATA = {
  "👋 Saludos": [
    {word:"Hola", video:"../assets/videos/hola.mp4"},
    {word:"Buenos días", video:"../assets/videos/buenos_dias.mp4"},
    {word:"Buenas tardes", video:"../assets/videos/buenas_tardes.mp4"},
    {word:"Buenas noches", video:"../assets/videos/buenas_noches.mp4"},
  ],
  "👨‍👩‍👦 Familia": [
    {word:"Mamá", video:"../assets/videos/mama.mp4"},
    {word:"Papá", video:"../assets/videos/papa.mp4"},
    {word:"Familia", video:"../assets/videos/familia.mp4"},
  ],
  "😊 Emociones": [
    {word:"Amor", video:"../assets/videos/amor.mp4"},
    {word:"Feliz", video:"../assets/videos/feliz.mp4"},
    {word:"Triste", video:"../assets/videos/triste.mp4"},
  ],
  "🎨 Colores": [
    {word:"Rojo", video:"../assets/videos/rojo.mp4"},
    {word:"Azul", video:"../assets/videos/azul.mp4"},
    {word:"Amarillo", video:"../assets/videos/amarillo.mp4"},
    {word:"Negro", video:"../assets/videos/negro.mp4"},
    {word:"Blanco", video:"../assets/videos/blanco.mp4"},
  ],
  "💪 Cuerpo": [
    {word:"Cabeza", video:"../assets/videos/cabeza.mp4"},
    {word:"Brazos", video:"../assets/videos/brazos.mp4"},
    {word:"Pies", video:"../assets/videos/pies.mp4"},
    {word:"Manos", video:"../assets/videos/manos.mp4"},
    {word:"Boca", video:"../assets/videos/boca.mp4"},
    {word:"Ojo", video:"../assets/videos/ojo.mp4"},
  ],
  "🐾 Animales": [
    {word:"Perro", video:"../assets/videos/perro.mp4"},
    {word:"Gato", video:"../assets/videos/gato.mp4"},
    {word:"Loro", video:"../assets/videos/loro.mp4"},
    {word:"Vaca", video:"../assets/videos/vaca.mp4"},
    {word:"Caballo", video:"../assets/videos/caballo.mp4"},
    {word:"Tiburón", video:"../assets/videos/tiburon.mp4"},
  ],
  "💼 Profesiones": [
    {word:"Profesor", video:"../assets/videos/profesor.mp4"},
  ],
};

let currentCat = Object.keys(ALL_DATA)[0];
let quizData = [], current = 0, score = 0;

// Build category buttons
const sel = document.getElementById('catSelector');
Object.keys(ALL_DATA).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (cat === currentCat ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    startQuiz();
  };
  sel.appendChild(btn);
});

function buildQuiz(catItems) {
  // Generate 5 questions mixing video→word and word→video
  const shuffled = [...catItems].sort(() => Math.random() - 0.5).slice(0, Math.min(5, catItems.length));
  return shuffled.map((item, i) => {
    const type = i % 2 === 0 ? 'video' : 'text';
    // Wrong options: 3 random from same category excluding correct
    const wrongs = catItems.filter(x => x.word !== item.word).sort(() => Math.random() - 0.5).slice(0, 3);
    const correctIdx = Math.floor(Math.random() * 4);
    const allOpts = [...wrongs];
    allOpts.splice(correctIdx, 0, item);
    return { type, item, options: allOpts, correct: correctIdx };
  });
}

function startQuiz() {
  quizData = buildQuiz(ALL_DATA[currentCat]);
  current = 0; score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('nextBtn').classList.remove('visible');
  loadQuestion();
}

function loadQuestion() {
  const q = quizData[current];
  const total = quizData.length;
  document.getElementById('progressLabel').textContent = `Pregunta ${current + 1} de ${total}`;
  document.getElementById('progressFill').style.width = ((current / total) * 100) + '%';

  const questionDiv = document.getElementById('question');
  const optionsDiv = document.getElementById('options');
  questionDiv.innerHTML = '';
  optionsDiv.innerHTML = '';

  if (q.type === 'video') {
    questionDiv.innerHTML = `<p class="q-prompt">¿Qué seña es esta?</p><video src="${q.item.video}" autoplay loop muted playsinline></video>`;
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.textContent = opt.word;
      div.onclick = () => selectOption(div, i);
      optionsDiv.appendChild(div);
    });
  } else {
    questionDiv.innerHTML = `<p class="q-prompt">¿Cuál es la seña de...?</p><h2>${q.item.word}</h2>`;
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<video src="${opt.video}" autoplay loop muted playsinline class="video-option"></video>`;
      div.onclick = () => selectOption(div, i);
      optionsDiv.appendChild(div);
    });
  }
  document.getElementById('nextBtn').classList.remove('visible');
}

function selectOption(element, index) {
  const q = quizData[current];
  const options = document.querySelectorAll('.option');
  options.forEach(o => o.style.pointerEvents = 'none');
  if (index === q.correct) {
    element.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
  } else {
    element.classList.add('wrong');
    options[q.correct].classList.add('correct');
  }
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  current++;
  if (current >= quizData.length) {
    showFinal();
    return;
  }
  loadQuestion();
}

function showFinal() {
  // Save progress
  localStorage.setItem('quiz_score', score);
  const best = localStorage.getItem('quiz_best') || 0;
  if (score > best) localStorage.setItem('quiz_best', score);
  const played = localStorage.getItem('quiz_played') || 0;
  localStorage.setItem('quiz_played', Number(played) + 1);

  if (window.SIGNOVA) {
    SIGNOVA.registrarHistorial('🧠', `Quiz de ${currentCat}: ${score}/${quizData.length}`, score);
    const { nuevos } = SIGNOVA.evaluarLogros();
    nuevos.forEach(SIGNOVA.mostrarToastLogro);
  }

  const total = quizData.length;
  const pct = Math.round((score / total) * 100);
  const emoji = pct === 100 ? '🏆' : pct >= 60 ? '🎉' : '💪';

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:999;padding:20px;text-align:center;';
  overlay.innerHTML = `
    <div style="background:white;color:#1a1a2e;border-radius:24px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <div style="font-size:3rem;margin-bottom:12px;">${emoji}</div>
      <h2 style="font-family:'Outfit',sans-serif;font-weight:900;font-size:1.8rem;margin-bottom:8px;">¡Quiz terminado!</h2>
      <p style="color:#6b7280;margin-bottom:20px;">Categoría: ${currentCat}</p>
      <div style="font-size:3rem;font-weight:900;color:#7c3aed;margin-bottom:4px;">${score}/${total}</div>
      <p style="color:#6b7280;margin-bottom:24px;">${pct}% de aciertos</p>
      <button onclick="location.reload()" style="padding:12px 24px;background:#7c3aed;color:white;border:none;border-radius:30px;font-weight:700;cursor:pointer;margin-right:8px;">Reintentar</button>
      <button onclick="window.location.href='../index.html'" style="padding:12px 24px;background:#f3f4f6;color:#1a1a2e;border:none;border-radius:30px;font-weight:700;cursor:pointer;">Inicio</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

startQuiz();
</script>
<script>
  (function() {
    var sesion = JSON.parse(localStorage.getItem('signova_sesion') || 'null');
    var label  = document.getElementById('nav-cuenta-label');
    if (sesion && label) label.textContent = sesion.nombre.split(' ')[0];
  })();
</script>
<script src="../assets/js/gamification.js"></script>
</body>
