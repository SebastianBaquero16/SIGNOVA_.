<style>
.game-container {
  max-width: 900px;
  margin: 40px auto;
  text-align: center;
  padding: 0 5%;
}
.game-container h1 {
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  background: linear-gradient(135deg, var(--magenta) 0%, #a855f7 50%, var(--cyan) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.game-container > p { color: var(--gris-suave); margin-bottom: 24px; }

/* Category selector */
.cat-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
}
.cat-btn {
  padding: 8px 16px;
  border-radius: 30px;
  border: 2px solid #e0d6ff;
  background: white;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--negro);
}
.cat-btn:hover, .cat-btn.active {
  background: var(--morado);
  color: white;
  border-color: var(--morado);
}

/* Stats bar */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 20px;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--gris-suave);
}
.stats-bar span b { color: var(--morado); }

/* Game grid */
.game-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-top: 10px;
}
@media (max-width: 600px) { .game-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 400px) { .game-grid { grid-template-columns: repeat(2, 1fr); } }

.card {
  background: var(--morado);
  color: white;
  min-height: 100px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s, background 0.2s;
  border: none;
  overflow: hidden;
}
.card:hover { transform: scale(1.04); }
.card.flip {
  background: white;
  color: black;
  border: 2px solid var(--morado);
}
.card.flip video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
}
.card.matched {
  background: #22c55e;
  color: white;
  border: none;
  cursor: default;
  transform: none;
}
.card.matched video { display: none; }
.card.matched::after { content: "✓"; font-size: 2rem; }

.new-game-btn {
  margin-top: 24px;
  padding: 12px 28px;
  background: var(--morado);
  color: white;
  border: none;
  border-radius: 30px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}
.new-game-btn:hover { opacity: 0.85; }
</style>
</head>

<div style="height:3px;background:linear-gradient(90deg,var(--magenta),#a855f7,var(--cyan))"></div>

<div class="game-container">
  <h1>🎮 Busca Parejas</h1>
  <p>Encuentra la palabra con su seña correspondiente. Elige una categoría:</p>

  <div class="cat-selector" id="catSelector"></div>

  <div class="stats-bar">
    <span>Parejas: <b id="matchCount">0</b> / <b id="totalPairs">0</b></span>
    <span>Intentos: <b id="attempts">0</b></span>
  </div>

  <div class="game-grid" id="game"></div>
  <button class="new-game-btn" onclick="startGame()">🔄 Nueva partida</button>
</div>

<script>
const CATEGORIES = {
  "👋 Saludos": [
    {id:1, word:"Hola", video:"../assets/videos/hola.mp4"},
    {id:2, word:"Buenos días", video:"../assets/videos/buenos_dias.mp4"},
    {id:3, word:"Buenas tardes", video:"../assets/videos/buenas_tardes.mp4"},
    {id:4, word:"Buenas noches", video:"../assets/videos/buenas_noches.mp4"},
  ],
  "👨‍👩‍👦 Familia": [
    {id:1, word:"Mamá", video:"../assets/videos/mama.mp4"},
    {id:2, word:"Papá", video:"../assets/videos/papa.mp4"},
    {id:3, word:"Familia", video:"../assets/videos/familia.mp4"},
  ],
  "😊 Emociones": [
    {id:1, word:"Amor", video:"../assets/videos/amor.mp4"},
    {id:2, word:"Feliz", video:"../assets/videos/feliz.mp4"},
    {id:3, word:"Triste", video:"../assets/videos/triste.mp4"},
  ],
  "🎨 Colores": [
    {id:1, word:"Rojo", video:"../assets/videos/rojo.mp4"},
    {id:2, word:"Azul", video:"../assets/videos/azul.mp4"},
    {id:3, word:"Amarillo", video:"../assets/videos/amarillo.mp4"},
  ],
  "💪 Cuerpo": [
    {id:1, word:"Cabeza", video:"../assets/videos/cabeza.mp4"},
    {id:2, word:"Brazos", video:"../assets/videos/brazos.mp4"},
    {id:3, word:"Pies", video:"../assets/videos/pies.mp4"},
    {id:4, word:"Manos", video:"../assets/videos/manos.mp4"},
  ],
  "🐾 Animales": [
    {id:1, word:"Perro", video:"../assets/videos/perro.mp4"},
    {id:2, word:"Gato", video:"../assets/videos/gato.mp4"},
    {id:3, word:"Vaca", video:"../assets/videos/vaca.mp4"},
    {id:4, word:"Caballo", video:"../assets/videos/caballo.mp4"},
  ],
  "💼 Profesiones": [
    {id:1, word:"Profesor", video:"../assets/videos/profesor.mp4"},
    {id:2, word:"Hola", video:"../assets/videos/hola.mp4"},
  ],
};

let currentCat = Object.keys(CATEGORIES)[0];
let matches = 0, attempts = 0, totalPairs = 0;
let firstCard = null, secondCard = null, lock = false;

// Build category buttons
const sel = document.getElementById('catSelector');
Object.keys(CATEGORIES).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (cat === currentCat ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    startGame();
  };
  sel.appendChild(btn);
});

function startGame() {
  matches = 0; attempts = 0;
  const pairs = CATEGORIES[currentCat];
  totalPairs = pairs.length;
  document.getElementById('matchCount').textContent = 0;
  document.getElementById('totalPairs').textContent = totalPairs;
  document.getElementById('attempts').textContent = 0;

  // Build cards: word + video for each pair
  let cards = [];
  pairs.forEach(p => {
    cards.push({id: p.id, type: 'word', content: p.word});
    cards.push({id: p.id, type: 'video', content: p.video});
  });
  cards = cards.sort(() => Math.random() - 0.5);

  const game = document.getElementById('game');
  game.innerHTML = '';
  firstCard = null; secondCard = null; lock = false;

  cards.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = item.id;
    div.dataset.type = item.type;
    div.dataset.content = item.content;
    div.textContent = '?';
    div.addEventListener('click', () => flipCard(div));
    game.appendChild(div);
  });
}

function flipCard(card) {
  if (lock || card.classList.contains('flip') || card.classList.contains('matched')) return;
  card.classList.add('flip');
  if (card.dataset.type === 'video') {
    card.innerHTML = `<video src="${card.dataset.content}" autoplay loop muted playsinline></video>`;
  } else {
    card.textContent = card.dataset.content;
  }
  if (!firstCard) {
    firstCard = card;
  } else {
    secondCard = card;
    lock = true;
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    checkMatch();
  }
}

function checkMatch() {
  if (firstCard.dataset.id === secondCard.dataset.id) {
    firstCard.classList.add('matched');
    secondCard.classList.add('matched');
    firstCard.innerHTML = ''; secondCard.innerHTML = '';
    matches++;
    document.getElementById('matchCount').textContent = matches;
    if (matches === totalPairs) {
      setTimeout(() => finalizarPartida(), 300);
    }
    reset();
  } else {
    setTimeout(() => {
      [firstCard, secondCard].forEach(c => {
        c.classList.remove('flip');
        c.innerHTML = '';
        c.textContent = '?';
      });
      reset();
    }, 1000);
  }
}

function reset() { firstCard = null; secondCard = null; lock = false; }

function finalizarPartida() {
  const jugadas = parseInt(localStorage.getItem('games_played') || '0');
  localStorage.setItem('games_played', jugadas + 1);

  if (window.SIGNOVA) {
    SIGNOVA.registrarHistorial('🎮', `Juego de memoria (${currentCat}): ${attempts} intentos`, totalPairs);
    const { nuevos } = SIGNOVA.evaluarLogros();
    nuevos.forEach(SIGNOVA.mostrarToastLogro);
  }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:999;padding:20px;text-align:center;';
  overlay.innerHTML = `
    <div style="background:white;color:#1a1a2e;border-radius:24px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <div style="font-size:3rem;margin-bottom:12px;">🎉</div>
      <h2 style="font-family:'Outfit',sans-serif;font-weight:900;font-size:1.8rem;margin-bottom:8px;">¡Completaste el juego!</h2>
      <p style="color:#6b7280;margin-bottom:20px;">Categoría: ${currentCat}</p>
      <div style="font-size:3rem;font-weight:900;color:#7c3aed;margin-bottom:4px;">${attempts}</div>
      <p style="color:#6b7280;margin-bottom:24px;">intentos para encontrar las ${totalPairs} parejas</p>
      <button onclick="location.reload()" style="padding:12px 24px;background:#7c3aed;color:white;border:none;border-radius:30px;font-weight:700;cursor:pointer;margin-right:8px;">Jugar de nuevo</button>
      <button onclick="window.location.href='../index.html'" style="padding:12px 24px;background:#f3f4f6;color:#1a1a2e;border:none;border-radius:30px;font-weight:700;cursor:pointer;">Inicio</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

startGame();
</script>

  })();
</script>
